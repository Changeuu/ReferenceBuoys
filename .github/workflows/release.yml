name: Release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content manifest.json | ConvertFrom-Json).version
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne $version -or $packageVersion -ne $version) {
            throw 'Tag, manifest.json and package.json versions must match.'
          }
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - name: Publish installable files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" main.js manifest.json styles.css "dist/reference-buoys-$env:RELEASE_TAG.zip" "dist/reference-buoys-$env:RELEASE_TAG.sha256" --verify-tag --title "Reference Buoys $env:RELEASE_TAG" --generate-notes
